name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Nuxt 3 + @nuxt/eslint 要求 Node 22
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: 构建项目（Nuxt node-server 产物）
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db" # 构建时仅需通过类型检查，实际数据库在 ECS 上

      - name: 打包部署产物
        run: |
          mkdir -p deploy-package
          # Nuxt 构建产物（含 node-server + 精简 node_modules + 静态资源），保留 .output 目录名
          # 与 ecosystem.config.js 的 script: "./.output/server/index.mjs" 对齐
          cp -r .output deploy-package/.output
          # Prisma schema（ECS 上需运行 prisma generate / db push）
          cp -r prisma deploy-package/prisma
          # package.json：让 ECS 上的 npx prisma/tsx 使用项目匹配版本执行迁移
          cp package.json deploy-package/package.json
          # PM2 配置（部署到 app 目录内，相对路径即可）
          cp ecosystem.config.js deploy-package/
          # 移除开发数据库文件，避免覆盖生产数据
          rm -f deploy-package/prisma/dev.db
          echo "打包完成 — $(du -sh deploy-package | cut -f1)"

      - name: 同步文件到 ECS
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.ECS_HOST }}
          REMOTE_USER: ${{ secrets.ECS_USER }}
          SOURCE: "deploy-package/"
          TARGET: ${{ secrets.ECS_DEPLOY_PATH }}
          ARGS: "-avz --delete --exclude='prisma/prod.db' --exclude='.env'"
          SCRIPT_BEFORE: |
            mkdir -p ${{ secrets.ECS_DEPLOY_PATH }}

          SCRIPT_AFTER: |
            # 创建持久化数据目录（与 app 同级）
            DEPLOY_BASE=$(dirname ${{ secrets.ECS_DEPLOY_PATH }})
            mkdir -p $DEPLOY_BASE/data
            mkdir -p $DEPLOY_BASE/logs

            # 写入生产环境变量（Nuxt node-server 运行时不会自动加载 .env，需注入）
            cat > ${{ secrets.ECS_DEPLOY_PATH }}/.env << 'DOTENV'
            DATABASE_URL="file:/var/www/flow-calendar/data/prod.db"
            ALLOWED_ORIGINS="flow-calendar.gouxinjie.com"
            DOTENV

            cd ${{ secrets.ECS_DEPLOY_PATH }}

            # Prisma 引擎已在 CI 构建时生成（含 rhel-openssl-1.1.x），ECS 无需重复安装
            # 数据库同步：仅在 prisma CLI 存在时执行（首次部署需手动执行）
            if command -v prisma &> /dev/null; then
              npx prisma db push
              # 为已有用户补齐默认标签（幂等，仅处理无标签用户）
              npx tsx prisma/migrate-default-tags.ts
            fi || true

            # PM2 热重载（首次则启动），ecosystem.config.js 会自动从 .env 注入 DATABASE_URL
            pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
            pm2 save
